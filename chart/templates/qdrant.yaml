{{- if not .Values.qdrant.enabled }}
{{- fail "qdrant es obligatorio: el runtime lo usa como knowledge provider" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: {{ include "alquimia.namespace" . }}
  labels:
    app: qdrant
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: {{ include "alquimia.namespace" . }}
  labels:
    app: qdrant
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      {{- include "alquimia.nodeAffinity" (dict "Values" .Values "local" .Values.qdrant.nodeAffinity) | nindent 6 }}
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        {{- if not (include "alquimia.isOpenShift" .) }}
        fsGroup: 1000
        {{- end }}
      containers:
        - name: qdrant
          image: {{ .Values.images.qdrant | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          env:
            - name: QDRANT__SERVICE__HTTP_PORT
              value: "6333"
            - name: QDRANT__SERVICE__GRPC_PORT
              value: "6334"
            {{- if eq (include "alquimia.helmSecrets" .) "true" }}
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: alquimia-qdrant
                  key: QDRANT_API_KEY
            {{- end }}
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: qdrant-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.qdrant.storage }}
