{{- if .Values.spire.enabled }}
{{- $ns := include "alquimia.spire.namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: {{ $ns }}
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-server-bundle-writer
  namespace: {{ $ns }}
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["spire-bundle"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-server-bundle-writer
  namespace: {{ $ns }}
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spire-server-bundle-writer
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-agent
  namespace: {{ $ns }}
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-agent
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-agent
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-agent
subjects:
  - kind: ServiceAccount
    name: spire-agent
    namespace: {{ $ns }}
---
# En OpenShift ata el SCC privileged. En Kubernetes y EKS el ClusterRole no
# existe y el binding no otorga nada.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-agent-privileged-scc
  namespace: {{ $ns }}
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: spire-agent
    namespace: {{ $ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spiffe-csi-driver
  namespace: {{ $ns }}
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spiffe-csi-driver-privileged-scc
  namespace: {{ $ns }}
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: spiffe-csi-driver
    namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-controller-manager
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["endpoints", "namespaces", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "list", "patch", "watch"]
  - apiGroups: ["spire.spiffe.io"]
    resources:
      - clusterfederatedtrustdomains
      - clusterspiffeids
      - clusterstaticentries
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["spire.spiffe.io"]
    resources:
      - clusterfederatedtrustdomains/finalizers
      - clusterspiffeids/finalizers
      - clusterstaticentries/finalizers
    verbs: ["update"]
  - apiGroups: ["spire.spiffe.io"]
    resources:
      - clusterfederatedtrustdomains/status
      - clusterspiffeids/status
      - clusterstaticentries/status
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-controller-manager
  labels:
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-controller-manager
subjects:
  - kind: ServiceAccount
    name: spire-server
    namespace: {{ $ns }}
{{- end }}
