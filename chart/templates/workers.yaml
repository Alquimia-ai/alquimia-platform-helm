{{- if .Values.runtime.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alquimia-runtime-worker
  namespace: {{ include "alquimia.namespace" . }}
  labels:
    app: alquimia-runtime
    app.kubernetes.io/part-of: alquimia
    role: worker
    {{- include "alquimia.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.runtime.workerReplicas }}
  selector:
    matchLabels:
      app: alquimia-runtime
      app.kubernetes.io/part-of: alquimia
      role: worker
  template:
    metadata:
      labels:
        app: alquimia-runtime
        app.kubernetes.io/part-of: alquimia
        role: worker
    spec:
      {{- if .Values.runtime.zeroTrust.enabled }}
      serviceAccountName: alquimia-runtime-sa
      {{- end }}
      {{- include "alquimia.nodeAffinity" (dict "Values" .Values "local" .Values.runtime.nodeAffinity) | nindent 6 }}
      restartPolicy: Always
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret.name }}
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
          - 1000
        fsGroupChangePolicy: OnRootMismatch
        {{- if not (include "alquimia.isOpenShift" .) }}
        fsGroup: 1000
        {{- end }}
      initContainers:
        {{- if and .Values.vault.enabled .Values.vault.autoUnseal }}
        {{- include "alquimia.waitVaultInit" . | nindent 8 }}
        {{- end }}
        - name: fetch-registry
          image: {{ .Values.images.rclone | quote }}
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              echo "Initializing registry..."
              set +e
              rclone sync :s3:${S3_BUCKET}/registry /var/lib/alquimia/registry \
                --s3-provider ${RCLONE_S3_PROVIDER} \
                --s3-endpoint ${RCLONE_S3_ENDPOINT} \
                --s3-access-key-id ${RCLONE_S3_ACCESS_KEY_ID} \
                --s3-secret-access-key ${RCLONE_S3_SECRET_ACCESS_KEY} \
                --s3-env-auth=false \
                -v
              rc=$?
              set -e
              if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
                echo "fetch-registry fallo: $rc"
                exit "$rc"
              fi
              echo "Registry ready. Exit: $rc"
          env:
            - name: RCLONE_S3_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: BLOB_S3_PROVIDER
            - name: RCLONE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: BLOB_S3_ENDPOINT_URL
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: BLOB_S3_ACCESS_KEY
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: BLOB_S3_SECRET_KEY
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: REGISTRY_S3_BUCKET_NAME
          volumeMounts:
            - name: registry-storage
              mountPath: /var/lib/alquimia/registry
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          {{- include "alquimia.helperResources" . | nindent 10 }}
        {{- include "alquimia.registryTrustInit" . | nindent 8 }}
      containers:
        - name: s3-sync
          image: {{ .Values.images.rclone | quote }}
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "Syncing registry..."
                rclone sync :s3:${S3_BUCKET}/registry /var/lib/alquimia/registry \
                  --s3-provider ${RCLONE_S3_PROVIDER} \
                  --s3-endpoint ${RCLONE_S3_ENDPOINT} \
                  --s3-access-key-id ${RCLONE_S3_ACCESS_KEY_ID} \
                  --s3-secret-access-key ${RCLONE_S3_SECRET_ACCESS_KEY} \
                  --s3-env-auth=false \
                  -v
                echo "Sync done. Sleeping ${SYNC_INTERVAL:-30}s"
                sleep ${SYNC_INTERVAL:-30}
              done
          env:
            - name: RCLONE_S3_PROVIDER
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: BLOB_S3_PROVIDER
            - name: RCLONE_S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: BLOB_S3_ENDPOINT_URL
            - name: RCLONE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: BLOB_S3_ACCESS_KEY
            - name: RCLONE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: BLOB_S3_SECRET_KEY
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: alquimia-s3
                  key: REGISTRY_S3_BUCKET_NAME
          volumeMounts:
            - name: registry-storage
              mountPath: /var/lib/alquimia/registry
          securityContext:
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          {{- include "alquimia.helperResources" . | nindent 10 }}
        - name: alquimia-runtime
          image: {{ .Values.images.runtime | quote }}
          imagePullPolicy: Always
          env:
            - name: ALQUIMIA_RUNTIME_MODE
              value: worker
            - name: ALQUIMIA_REGISTRY_DIR
              value: /var/lib/alquimia/registry
            - name: DOCKER_CONFIG
              value: /var/docker-config
            - name: ALQUIMIA_EMBEDDINGS_CONFIG_DIR
              value: /var/lib/alquimia
            - name: HF_HOME
              value: /var/lib/alquimia/cache
            - name: TMPDIR
              value: /tmp
            {{- include "alquimia.registryTrustEnv" . | nindent 12 }}
            - name: SPIFFE_ENABLED
              value: {{ if .Values.runtime.zeroTrust.enabled }}"true"{{ else }}"false"{{ end }}
            - name: SPIFFE_SOCKET_PATH
              value: {{ .Values.runtime.zeroTrust.socketPath | default "/run/spire/sockets/agent.sock" | quote }}
            {{- if .Values.runtime.zeroTrust.enabled }}
            - name: SPIFFE_TRUST_DOMAIN
              value: {{ .Values.runtime.zeroTrust.trustDomain | quote }}
            {{- if .Values.runtime.zeroTrust.delegated }}
            - name: SPIFFE_DELEGATED_ENABLED
              value: "true"
            {{- end }}
            - name: VAULT_AUTH_METHOD
              value: kubernetes
            - name: VAULT_K8S_ROLE
              value: alquimia-runtime-worker
            - name: VAULT_AUTH_ROLE
              value: alquimia-runtime-worker
            - name: VAULT_K8S_TOKEN_PATH
              value: /var/run/secrets/vault/service-account/vault-token
            {{- end }}
          envFrom:
            - configMapRef:
                name: alquimia-config
            - secretRef:
                name: alquimia-kafka-signing
            - secretRef:
                name: alquimia-redis
            - secretRef:
                name: alquimia-postgres
            - secretRef:
                name: alquimia-s3
            - secretRef:
                name: alquimia-auth
            {{- if not .Values.runtime.zeroTrust.enabled }}
            - secretRef:
                name: alquimia-vault
            {{- end }}
            {{- if eq (include "alquimia.runtimeKeycloak" .) "true" }}
            - secretRef:
                name: alquimia-keycloak
            {{- end }}
            {{- if eq (include "alquimia.helmSecrets" .) "true" }}
            - secretRef:
                name: alquimia-qdrant
            {{- end }}
            {{- if and .Values.runtime.secrets.encryptionKey .Values.runtime.secrets.registryKey }}
            - secretRef:
                name: alquimia-encryption
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: registry-storage
              readOnly: true
              mountPath: /var/lib/alquimia/registry
            - name: registry-config
              readOnly: true
              mountPath: /var/docker-config
            - name: cache-storage
              mountPath: /var/lib/alquimia/cache
            - name: tmp
              mountPath: /tmp
            {{- include "alquimia.registryTrustMount" . | nindent 12 }}
            {{- if .Values.runtime.cosign.publicKey }}
            - name: cosign-key
              mountPath: /etc/alquimia/cosign
              readOnly: true
            {{- end }}
            {{- if .Values.runtime.zeroTrust.enabled }}
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
            - name: vault-k8s-token
              mountPath: /var/run/secrets/vault/service-account
              readOnly: true
            {{- end }}
          {{- include "alquimia.runtimeContainerSecurity" . | nindent 10 }}
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 8080
              scheme: HTTP
            timeoutSeconds: 1
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 10
            periodSeconds: 30
            failureThreshold: 10
      volumes:
        - name: registry-storage
          emptyDir: {}
        - name: registry-config
          secret:
            secretName: alquimia-registry-config
            items:
              - key: .dockerconfigjson
                path: config.json
            defaultMode: 420
        - name: cache-storage
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- include "alquimia.registryTrustVolumes" . | nindent 8 }}
        {{- if .Values.runtime.cosign.publicKey }}
        - name: cosign-key
          configMap:
            name: alquimia-cosign
            defaultMode: 0444
        {{- end }}
        {{- if .Values.runtime.zeroTrust.enabled }}
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: vault-k8s-token
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  path: vault-token
                  expirationSeconds: 3600
                  audience: vault
        {{- end }}
{{- end }}
