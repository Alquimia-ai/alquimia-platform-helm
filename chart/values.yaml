# In Argo CD these can be overridden in spec.source.helm.values / valueFiles.
# This file is the profile without zero trust (Sealed Secrets).
# The ZT profile, without Sealed Secrets, is values-zt.yaml.

namespace: alquimia-platform
# The chart does not create this namespace. If the release owns it, the next
# upgrade deletes it (the Helm secret lives inside) and the namespace becomes
# impossible to delete. Create it with: helm --create-namespace, or let it already exist.

# sealed: Argo CD applies SealedSecret (values-sealed.yaml). Helm does not create Secrets.
# helm: creates Secrets from values (local only, not GitOps).
secrets:
  backend: sealed

sealedSecrets: {}

# Empty: taken from ingresses.config.openshift.io/cluster (spec.domain).
appsDomain: ""

# Optional. If empty, affinity is not set.
# A component can override it with minio.nodeAffinity, kafka.nodeAffinity, and so on.
nodeAffinity: {}
  # requiredDuringSchedulingIgnoredDuringExecution:
  #   nodeSelectorTerms:
  #     - matchExpressions:
  #         - key: node-role.kubernetes.io/worker
  #           operator: Exists

imagePullSecret:
  create: false
  name: alquimia-dockerhub-pull
  server: https://index.docker.io/v1/
  username: ""
  password: ""

images:
  # quay.io/minio/minio no longer allows anonymous pull. pgsty/minio is the
  # community build, same server /data and MINIO_ROOT_*.
  minio: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
  postgres: docker.io/library/postgres:16
  redis: redis:7
  qdrant: docker.io/qdrant/qdrant:v1.19.2
  registry: ghcr.io/project-zot/zot:v2.1.5
  rclone: rclone/rclone:1.75.1
  runtime: alquimiaai/runtime:0.7.2
  studio: alquimiaai/studio:0.2.1
  vault: docker.io/hashicorp/vault:1.21.2
  kafka: apache/kafka:3.8.0
  curl: curlimages/curl:8.11.1
  keycloak: quay.io/keycloak/keycloak:26.7.3
  busybox: busybox:1.36
  spireServer: ghcr.io/spiffe/spire-server:1.9.6
  spireAgent: ghcr.io/spiffe/spire-agent:1.9.6
  spireOidc: ghcr.io/spiffe/oidc-discovery-provider:1.9.6
  spireControllerManager: ghcr.io/spiffe/spire-controller-manager:0.6.0
  spireCsiDriver: ghcr.io/spiffe/spiffe-csi-driver:0.2.4
  spireCsiRegistrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0

minio:
  enabled: true
  storage: 100Gi
  auth:
    rootUser: ""
    rootPassword: ""

kafka:
  enabled: true
  replicas: 1
  storage: 100Gi
  clusterId: MkU3OEVBNTcwNTJENDM2Qk
  topics:
    - name: alquimia.events
      partitions: 6
      replicationFactor: 1
    - name: alquimia.events.dlq
      partitions: 3
      replicationFactor: 1

postgresql:
  enabled: true
  storage: 200Gi
  auth:
    database: runtime
    username: appuser
    password: ""

redis:
  enabled: true
  storage: 25Gi

# Required. The runtime uses Qdrant as the knowledge provider and, if there
# is no service, falls back to http://localhost:6333.
qdrant:
  enabled: true
  storage: 10Gi

registry:
  enabled: true
  storage: 10Gi
  # local: deploys zot (Service oras-registry) and it is the runtime's default registry.
  # remote: does not deploy it; the runtime uses host only.
  mode: local
  host: ""
  # With tls the local registry speaks HTTPS. The chart stores the CA and the
  # runtime trusts it, so ORAS_INSECURE stays false and it can also talk to
  # public.host over HTTPS.
  tls: true
  plainHttp: false
  insecure: false
  public:
    # Replace with the environment's host. Example: registry.acme.example
    host: registry.acme.example
    # Harbor requires login even when the project is public. Empty: no credential.
    username: ""
    password: ""
  htpasswd: ""
  dockerconfig:
    username: ""
    password: ""

vault:
  enabled: true
  storage: 10Gi
  autoUnseal: true
  keyShares: 1
  keyThreshold: 1
  keysSecret: vault-keys
  # false: does not create the SA (for example Argo cannot). Create it out of band
  # (docs/vault-unsealer-rbac.md) and reference it with name.
  serviceAccount:
    create: true
    name: vault-unsealer

# OTLP HTTP collector shared by runtime and Studio.
# Documentation: OTEL_COLLECTOR_ENDPOINT* in Runtime configuration and Studio overview.
# false: the runtime does not export and Studio honors studio.config.OTEL_SDK_DISABLED.
otel:
  enabled: false
  # Base without /v1. Internal or public.
  # Example: http://otel-collector.observability.svc.cluster.local:4318
  endpoint: ""
  tracesPath: /v1/traces
  metricsPath: /v1/metrics
  logsPath: /v1/logs
  # Prepended to OTEL_ALQUIMIA_SERVICE_NAME. Empty: serviceName is used as-is.
  # Example: eks- with runtime.serviceName alquimia-runtime → eks-alquimia-runtime.
  serviceNamePrefix: ""
  intervalMillis: "5000"
  internalMillis: "5000"
  timeoutMillis: "5000"
  # PII that must not leave in telemetry, even if the collector is not up yet.
  excludedAttributes: session_id,channel_id,user_id
  runtime:
    serviceName: alquimia
    meterName: alquimia-metrics
    sdkDisabled: "false"
    excludedUrls: liveness,readiness
  studio:
    serviceName: alquimia-studio
    sdkDisabled: "false"

runtime:
  enabled: true
  masterReplicas: 1
  workerReplicas: 3
  registryStorage: 10Gi
  # Recreate: the registry PVC is ReadWriteOnce and cannot be mounted by two pods at once.
  # RollingUpdate leaves the rollout stuck until the previous pod releases the disk.
  masterUpdateStrategy: Recreate
  # cluster: Service only (svc.cluster.local). ingress: Ingress. route: OpenShift Route.
  exposure: cluster
  host: ""
  ingress:
    className: ""
    path: /
    pathType: Prefix
    annotations: {}
  config:
    DEBUG: "False"
    IS_ALLOWED_CREDENTIALS: "False"
    # With registry.tls the chart forces HTTPS and verifies the local CA.
    # These values apply only if the local registry stays on HTTP.
    ORAS_INSECURE: "false"
    ORAS_PLAIN_HTTP: "false"
    ALQUIMIA_OCI_DEV_MODE: "false"
    # true: each publish is attached to the namespace index
    # (agents/index, brains/index). false leaves it only in its repository.
    ALQUIMIA_OCI_INDEX_ENABLED: "true"
    ALQUIMIA_OCI_REFERRERS_FALLBACK: error
    ALQUIMIA_OCI_SUBPROCESS_TIMEOUT: "300"
    ALQUIMIA_OCI_COSIGN_HOME: /tmp/cosign
    ALQUIMIA_OCI_COSIGN_TLOG_UPLOAD: "false"
    ALQUIMIA_REGISTRY_DIR: /var/lib/alquimia/registry
    ALQUIMIA_REGISTRY_SECRET_RESOLVER: vault
    ALQUIMIA_REGISTRY_REHYDRATE_ENABLED: "true"
    ALQUIMIA_REGISTRY_REHYDRATE_BUNDLED_BLOBS: "false"
    VAULT_MOUNT_POINT: secret
    VAULT_TLS: "false"
    DB_POOL_SIZE: "10"
    DB_POOL_OVERFLOW: "10"
    DB_POOL_PRE_PING: "true"
    DB_POOL_RECYCLE: "1800"
    DB_CREATE_ON_STARTUP: "false"
    TOOL_AUTHZ_ENABLED: "true"
    TOOL_AUTHZ_DEFAULT_DENY: "false"
    KNOWLEDGE_AUTHZ_ENABLED: "true"
    KNOWLEDGE_AUTHZ_DEFAULT_DENY: "false"
    KAFKA_MAX_REQUEST_SIZE: "10485760"
  # false: runtime with API_TOKEN, Kafka in the clear, and OCI in dev mode.
  # true: alquimia-runtime-develop profile (Keycloak, SPIFFE, OCI signing,
  # TLS_ENFORCE). The runtime mounts the CSI socket; spire.enabled installs
  # the server and the agent (or they must already exist). This chart's Kafka
  # has no TLS: kafkaSecurityProtocol stays PLAINTEXT unless you point at a
  # broker with auth.
  zeroTrust:
    enabled: false
    acceptedAudiences: alquimia-runtime
    roleSourceClients: alquimia-runtime,alquimia-studio-service,alquimia-ci
    # SPIFFE trust domain for this installation. Example: acme.example
    trustDomain: acme.example
    socketPath: /run/spire/sockets/agent.sock
    delegated: true
    agentspaceProvisioning: true
    provisioningIntervalSeconds: "300"
    provisioningNamespace: spire
    vaultJwtAuthPath: jwt
    signaturePolicy: required
    tlsEnforce: false
    # Apply only if registry.tls is false. With tls the runtime trusts the local
    # CA and these flags stay false.
    orasPlainHttp: "false"
    orasInsecure: "false"
    kafkaSecurityProtocol: PLAINTEXT
  # publicKey: public key PEM. Empty: it is not mounted and pulls with
  # signaturePolicy=required still cannot verify.
  # privateKey: private key PEM. Empty: the runtime does not sign on push.
  # Stored in the alquimia-cosign-key Secret, mounted at
  # /etc/alquimia/cosign/cosign.key, and ALQUIMIA_OCI_COSIGN_KEY points at that path.
  # password: passphrase of that key (COSIGN_PASSWORD). Empty is valid.
  cosign:
    publicKey: ""
    privateKey: ""
    password: ""
  # Empty: embeddings.yaml is not mounted. provider_id: openai, huggingface,
  # huggingface_hub, or inmemory. A secret is written as
  # $secretRef and lives in Vault (secret/<agentspace>/shared/<KEY>).
  # Example:
  #   provider_id: huggingface
  #   params:
  #     model: https://embeddings.acme.example
  #     api_key:
  #       $secretRef: EMBEDDINGS_API_KEY
  embeddings:
    config: {}
  secrets:
    kafkaSigningKey: ""
    apiToken: ""
    vaultToken: ""
    # Empty: the Secret is not created. Generate it once and back it up
    # outside the cluster; without the key, data already encrypted cannot be read.
    encryptionKey: ""
    encryptionKeyId: ""
    registryKey: ""
    registryKeyId: ""
    # Must match what the channel connectors sign with.
    channelNotificationSecret: ""
    s3:
      accessKey: ""
      secretKey: ""
      bucketName: alquimia-runtime-blob-storage
      registryBucketName: alquimia-runtime-registry-storage
      provider: Minio
      region: us-east-1
      secure: "false"

# false: does not install SPIRE. true: server, agent, CSI, OIDC discovery,
# controller-manager, and the master/worker ClusterStaticEntry resources.
# Separate namespace (privileged). The runtime stays in the chart namespace
# and uses the socket through CSI, so it can stay restricted.
# platform auto: on a helm install against OpenShift it copies the kubelet CA;
# on Kubernetes/EKS it does not. With Argo the lookup usually comes back empty:
# on OpenShift set platform: openshift and create the spire-agent-kubelet-ca
# ConfigMap (key ca.crt) or paste the PEM in kubeletCA.bundle.
# kubeletRoot: /var/lib/kubelet on OpenShift, EKS, and Kubernetes. Change it if
# the AMI moves the kubelet.
spire:
  enabled: false
  namespace: spire
  platform: auto
  clusterName: alquimia
  # Empty: runtime.zeroTrust.trustDomain.
  trustDomain: ""
  storage: 1Gi
  storageClass: ""
  socketHostPath: /run/spire/sockets
  kubeletRoot: /var/lib/kubelet
  agentRunAsUser: 1000
  imagePullSecrets: []
  tolerations: []
  kubeletCA:
    bundle: ""

# No Keycloak Operator. With enabled: true it uses this chart's PostgreSQL
# (database `database`) in the same namespace.
# With enabled: false it installs nothing: existing.url or existing.service point
# at an instance that already exists. The chart writes that URL to the keycloak-config ConfigMap.
keycloak:
  # false: does not create Deployment, Service, Route, or Ingress.
  enabled: true
  existing:
    # URL of the external instance. Takes priority over service.
    url: ""
    # Existing Service, usually in another namespace.
    service: ""
    namespace: ""
    port: 8080
    # Existing Secret with the admin. Only recorded in keycloak-config.
    secretName: ""
  # Realm that issues user JWTs (OIDC).
  realm: alquimia
  # The alquimia-runtime-develop runtime rejects the generic account audience.
  acceptedAudiences: alquimia-runtime
  # Optional if runtime.zeroTrust.enabled is false. With zeroTrust the runtime
  # uses Keycloak anyway (AUTH_PROVIDER=keycloak).
  runtimeAuth:
    enabled: false
    clientId: alquimia-runtime
    clientSecret: ""
    # Secret of the admin client FastAPIKeycloak uses for client_credentials.
    adminClientSecret: ""
    callbackUri: ""
  # Studio can stay on AUTH_STRATEGY=lite. true switches it to Keycloak (NextAuth).
  studioAuth:
    enabled: false
    clientId: alquimia-studio
    clientSecret: ""
  replicas: 1
  database: keycloak
  # Empty: keycloak.<appsDomain> (the cluster apps domain).
  host: ""
  # route (OpenShift) or ingress (EKS or another cluster with Ingress).
  exposure: route
  ingress:
    className: ""
    path: /
    pathType: Prefix
    annotations: {}
    # On EKS with the AWS Load Balancer Controller, for example:
    # className: alb
    # annotations:
    #   alb.ingress.kubernetes.io/scheme: internet-facing
    #   alb.ingress.kubernetes.io/target-type: ip
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    #   alb.ingress.kubernetes.io/ssl-redirect: "443"
    #   alb.ingress.kubernetes.io/group.name: acme
    #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/ID
    tls:
      enabled: false
      secretName: ""
  auth:
    username: ""
    password: ""

# false: does not create ClusterPolicy. Kyverno must already be installed in the cluster;
# this chart does not install it. true: applies the policies from
# alquimia-runtime-develop/k8s/policies/kyverno to every Pod in the namespace.
# With Enforce, a Pod that does not comply (registry, securityContext, CPU/memory
# limits, or the alquimiaai/runtime signature) is not created.
kyverno:
  enabled: false

studio:
  enabled: true
  replicas: 1
  storage: 5Gi
  # cluster: Service only (svc.cluster.local). ingress: Ingress. route: OpenShift Route.
  exposure: route
  # Empty on route: alquimia-studio.<appsDomain>. On ingress it is required.
  host: ""
  # https on a cluster with TLS. http only if the Ingress does not terminate TLS.
  scheme: https
  ingress:
    className: ""
    path: /
    pathType: Prefix
    annotations: {}
  config:
    DB_STRATEGY: lite
    AUTH_STRATEGY: lite
    NEXT_PUBLIC_DEFAULT_NAMESPACE: alquimia
    # on and true in the zero trust profile. off and false leave Studio without ZT.
    NEXT_PUBLIC_ZERO_TRUST: "off"
    NEXT_PUBLIC_TOOL_AUTHZ_ENABLED: "false"
    RUNTIME_USER_IDENTITY: passthrough
    RUNTIME_TOKEN_AUDIENCE: alquimia-runtime
    # Same host as registry.public.host. Example: registry.acme.example
    EXTERNAL_REGISTRY_URL: registry.acme.example
    EXTERNAL_REGISTRY_AGENTS_PROJECT: agents
    EXTERNAL_REGISTRY_BRAINS_PROJECT: brains
    # Ignored when otel.enabled: the SDK uses otel.studio.sdkDisabled.
    OTEL_SDK_DISABLED: "true"
    NODE_ENV: production
  secrets:
    # JSON: [{email, name, password_hash}]. password_hash is the bcrypt in base64.
    authLiteUsers: ""
    # Empty and runtime without Keycloak: Studio uses runtime.secrets.apiToken.
    # The runtime compares that credential with API_TOKEN; any other value is rejected.
    assistantApiKey: ""
    nextAuthSecret: ""
