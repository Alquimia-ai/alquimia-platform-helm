# En Argo CD se pueden sobreescribir en spec.source.helm.values / valueFiles.

namespace: alquimia-platform
# Si el Project/Namespace ya existe, el chart no lo recrea (lookup).
# true: lo crea solo cuando falta. false: nunca lo gestiona el chart.
createNamespace: true

# sealed: Argo CD aplica SealedSecret (values-sealed.yaml). Helm no crea Secrets.
# helm: crea Secrets desde values (solo local, no GitOps).
secrets:
  backend: sealed

sealedSecrets: {}

# Vacío: se toma de ingresses.config.openshift.io/cluster (spec.domain).
appsDomain: ""

# Opcional. Si está vacío no se setea affinity.
# Un componente puede sobreescribirlo con minio.nodeAffinity, kafka.nodeAffinity, etc.
nodeAffinity: {}
  # requiredDuringSchedulingIgnoredDuringExecution:
  #   nodeSelectorTerms:
  #     - matchExpressions:
  #         - key: node-role.kubernetes.io/worker
  #           operator: Exists

imagePullSecret:
  create: false
  name: alquimia-dockerhub-pull
  server: https://index.docker.io/v1/
  username: ""
  password: ""

images:
  minio: quay.io/minio/minio:RELEASE.2023-10-24T04-42-36Z
  postgres: docker.io/library/postgres:16
  redis: redis:7
  registry: ghcr.io/oras-project/registry:latest
  rclone: rclone/rclone:latest
  runtime: alquimiaai/runtime:0.5.0
  studio: alquimiaai/studio:latest-20260714-2037
  vault: docker.io/hashicorp/vault:1.21.2
  kafka: apache/kafka:3.8.0
  curl: curlimages/curl:8.11.1
  keycloak: quay.io/keycloak/keycloak:26.7.3

minio:
  enabled: true
  storage: 100Gi
  auth:
    rootUser: ""
    rootPassword: ""

kafka:
  enabled: true
  replicas: 1
  storage: 100Gi
  clusterId: MkU3OEVBNTcwNTJENDM2Qk
  topics:
    - name: alquimia.events
      partitions: 6
      replicationFactor: 1
    - name: alquimia.events.dlq
      partitions: 3
      replicationFactor: 1

postgresql:
  enabled: true
  storage: 200Gi
  auth:
    database: runtime
    username: appuser
    password: ""

redis:
  enabled: true
  storage: 25Gi

registry:
  enabled: true
  storage: 10Gi
  htpasswd: ""
  dockerconfig:
    username: ""
    password: ""

vault:
  enabled: true
  storage: 10Gi
  autoUnseal: true
  keyShares: 1
  keyThreshold: 1
  keysSecret: vault-keys
  # false: no crea el SA (p. ej. Argo no puede). Crear por consola
  # (docs/vault-unsealer-rbac.md) y referenciarlo con name.
  serviceAccount:
    create: true
    name: vault-unsealer

# Collector OTLP HTTP compartido por runtime y Studio.
# Documentación: OTEL_COLLECTOR_ENDPOINT* en Runtime configuration y Studio overview.
# false: el runtime no exporta y Studio respeta OTEL_SDK_DISABLED.
otel:
  enabled: false
  # Base sin /v1. Ej: http://otel-collector.observability.svc.cluster.local:4318
  endpoint: ""
  tracesPath: /v1/traces
  metricsPath: /v1/metrics
  logsPath: /v1/logs
  intervalMillis: "5000"
  # Solo runtime. Vacío: no se setea OTEL_EXCLUDED_ATTRIBUTES.
  excludedAttributes: ""

runtime:
  enabled: true
  masterReplicas: 1
  workerReplicas: 3
  registryStorage: 10Gi
  config:
    DEBUG: "False"
    IS_ALLOWED_CREDENTIALS: "False"
    ORAS_INSECURE: "true"
    ORAS_PLAIN_HTTP: "true"
    ALQUIMIA_OCI_DEV_MODE: "true"
    ALQUIMIA_REGISTRY_DIR: /var/lib/alquimia/registry
    ALQUIMIA_REGISTRY_SECRET_RESOLVER: vault
    VAULT_MOUNT_POINT: cubbyhole
    KAFKA_MAX_REQUEST_SIZE: "10485760"
  secrets:
    kafkaSigningKey: ""
    apiToken: ""
    vaultToken: ""
    s3:
      accessKey: ""
      secretKey: ""
      bucketName: alquimia-runtime-blob-storage
      registryBucketName: alquimia-runtime-registry-storage
      provider: Minio
      region: us-east-1
      secure: "false"

# Sin Keycloak Operator. Con enabled: true usa el PostgreSQL de este chart
# (base `database`) en el mismo namespace.
# Con enabled: false no instala nada: existing.url o existing.service apuntan
# a una instancia que ya existe. El chart deja esa URL en el ConfigMap keycloak-config.
keycloak:
  # false: no crea Deployment, Service, Route ni Ingress.
  enabled: true
  existing:
    # URL de la instancia externa. Tiene prioridad sobre service.
    url: ""
    # Service ya existente, normalmente en otro namespace.
    service: ""
    namespace: ""
    port: 8080
    # Secret ya existente con el admin. Solo se anota en keycloak-config.
    secretName: ""
  # Realm que emite los JWT de usuarios (OIDC).
  realm: alquimia
  acceptedAudiences: account,alquimia-cli
  # Zero Trust de callers: el runtime valida JWT del realm (AUTH_PROVIDER=keycloak).
  # false: sigue autenticando servicios con API_TOKEN.
  runtimeAuth:
    enabled: false
    clientId: alquimia-runtime
    clientSecret: ""
    callbackUri: ""
  # Studio puede quedar en AUTH_STRATEGY=lite. true lo pasa a Keycloak (NextAuth).
  studioAuth:
    enabled: false
    clientId: alquimia-studio
    clientSecret: ""
  replicas: 1
  database: keycloak
  # Vacío: keycloak.<appsDomain> (dominio apps del cluster).
  host: ""
  # route (OpenShift) o ingress (EKS u otro cluster con Ingress).
  exposure: route
  ingress:
    className: ""
    path: /
    pathType: Prefix
    annotations: {}
    # En EKS con AWS Load Balancer Controller, por ejemplo:
    # className: alb
    # annotations:
    #   alb.ingress.kubernetes.io/scheme: internet-facing
    #   alb.ingress.kubernetes.io/target-type: ip
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    #   alb.ingress.kubernetes.io/ssl-redirect: "443"
    #   alb.ingress.kubernetes.io/group.name: alquimia
    #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/ID
    tls:
      enabled: false
      secretName: ""
  auth:
    username: ""
    password: ""

studio:
  enabled: true
  replicas: 1
  storage: 5Gi
  # Vacío: alquimia-studio.<appsDomain> (dominio apps del cluster).
  host: ""
  config:
    DB_STRATEGY: lite
    AUTH_STRATEGY: lite
    NEXT_PUBLIC_DEFAULT_NAMESPACE: alquimia
    # Se ignora si otel.enabled: el SDK queda activo para exportar al collector.
    OTEL_SDK_DISABLED: "true"
    NODE_ENV: production
  secrets:
    authLiteUsers: ""
    assistantApiKey: ""
    nextAuthSecret: ""
