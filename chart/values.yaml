# En Argo CD se pueden sobreescribir en spec.source.helm.values / valueFiles.
# Este archivo es el perfil sin zero trust (Sealed Secrets).
# El perfil con ZT, sin Sealed Secrets, es values-zt.yaml.

namespace: alquimia-platform
# El chart no crea este namespace. Si lo mete en el release, el upgrade
# siguiente lo borra (el secret de Helm vive adentro) y el namespace queda
# imposible de borrar. Crearlo con: helm --create-namespace, o que ya exista.

# sealed: Argo CD aplica SealedSecret (values-sealed.yaml). Helm no crea Secrets.
# helm: crea Secrets desde values (solo local, no GitOps).
secrets:
  backend: sealed

sealedSecrets: {}

# Vacío: se toma de ingresses.config.openshift.io/cluster (spec.domain).
appsDomain: ""

# Opcional. Si está vacío no se setea affinity.
# Un componente puede sobreescribirlo con minio.nodeAffinity, kafka.nodeAffinity, etc.
nodeAffinity: {}
  # requiredDuringSchedulingIgnoredDuringExecution:
  #   nodeSelectorTerms:
  #     - matchExpressions:
  #         - key: node-role.kubernetes.io/worker
  #           operator: Exists

imagePullSecret:
  create: false
  name: alquimia-dockerhub-pull
  server: https://index.docker.io/v1/
  username: ""
  password: ""

images:
  # quay.io/minio/minio ya no permite pull anónimo. pgsty/minio es el build
  # de la comunidad, mismo server /data y MINIO_ROOT_*.
  minio: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z
  postgres: docker.io/library/postgres:16
  redis: redis:7
  qdrant: docker.io/qdrant/qdrant:v1.19.2
  registry: ghcr.io/oras-project/registry:v1.0.0-rc.4
  rclone: rclone/rclone:1.75.1
  runtime: alquimiaai/runtime:0.5.4
  studio: alquimiaai/studio:latest-20261002-2112
  vault: docker.io/hashicorp/vault:1.21.2
  kafka: apache/kafka:3.8.0
  curl: curlimages/curl:8.11.1
  keycloak: quay.io/keycloak/keycloak:26.7.3
  busybox: busybox:1.36
  spireServer: ghcr.io/spiffe/spire-server:1.9.6
  spireAgent: ghcr.io/spiffe/spire-agent:1.9.6
  spireOidc: ghcr.io/spiffe/oidc-discovery-provider:1.9.6
  spireControllerManager: ghcr.io/spiffe/spire-controller-manager:0.6.0
  spireCsiDriver: ghcr.io/spiffe/spiffe-csi-driver:0.2.4
  spireCsiRegistrar: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.10.0

minio:
  enabled: true
  storage: 100Gi
  auth:
    rootUser: ""
    rootPassword: ""

kafka:
  enabled: true
  replicas: 1
  storage: 100Gi
  clusterId: MkU3OEVBNTcwNTJENDM2Qk
  topics:
    - name: alquimia.events
      partitions: 6
      replicationFactor: 1
    - name: alquimia.events.dlq
      partitions: 3
      replicationFactor: 1

postgresql:
  enabled: true
  storage: 200Gi
  auth:
    database: runtime
    username: appuser
    password: ""

redis:
  enabled: true
  storage: 25Gi

# Obligatorio. El runtime usa Qdrant como knowledge provider y, si no hay
# servicio, cae en http://localhost:6333.
qdrant:
  enabled: true
  storage: 10Gi

registry:
  enabled: true
  storage: 10Gi
  # local: despliega oras-registry y es el registry por defecto del runtime.
  # remote: no lo despliega; el runtime usa solo host.
  mode: local
  host: ""
  # Con tls el registry local habla HTTPS. El chart guarda la CA y el runtime
  # la confía, así ORAS_INSECURE queda en false y también puede hablar con
  # public.host por HTTPS.
  tls: true
  plainHttp: false
  insecure: false
  public:
    # El cliente lo reemplaza. Ejemplo: registry.acme.example
    host: registry.acme.example
    # Harbor pide login aunque el proyecto sea público. Vacío: sin credencial.
    username: ""
    password: ""
  htpasswd: ""
  dockerconfig:
    username: ""
    password: ""

vault:
  enabled: true
  storage: 10Gi
  autoUnseal: true
  keyShares: 1
  keyThreshold: 1
  keysSecret: vault-keys
  # false: no crea el SA (p. ej. Argo no puede). Crear por consola
  # (docs/vault-unsealer-rbac.md) y referenciarlo con name.
  serviceAccount:
    create: true
    name: vault-unsealer

# Collector OTLP HTTP compartido por runtime y Studio.
# Documentación: OTEL_COLLECTOR_ENDPOINT* en Runtime configuration y Studio overview.
# false: el runtime no exporta y Studio respeta OTEL_SDK_DISABLED.
otel:
  enabled: false
  # Base sin /v1. Ej: http://otel-collector.observability.svc.cluster.local:4318
  endpoint: ""
  tracesPath: /v1/traces
  metricsPath: /v1/metrics
  logsPath: /v1/logs
  intervalMillis: "5000"
  # PII que no debe salir en telemetría, aunque el collector todavía no esté.
  excludedAttributes: session_id,channel_id,user_id

runtime:
  enabled: true
  masterReplicas: 1
  workerReplicas: 3
  registryStorage: 10Gi
  # cluster: solo el Service (svc.cluster.local). ingress: Ingress. route: Route de OpenShift.
  exposure: cluster
  host: ""
  ingress:
    className: ""
    path: /
    pathType: Prefix
    annotations: {}
  config:
    DEBUG: "False"
    IS_ALLOWED_CREDENTIALS: "False"
    # Con registry.tls el chart fuerza HTTPS y verifica la CA local.
    # Estos valores solo aplican si el registry local queda en HTTP.
    ORAS_INSECURE: "false"
    ORAS_PLAIN_HTTP: "false"
    ALQUIMIA_OCI_DEV_MODE: "false"
    ALQUIMIA_OCI_REFERRERS_FALLBACK: error
    ALQUIMIA_OCI_SUBPROCESS_TIMEOUT: "300"
    ALQUIMIA_OCI_COSIGN_HOME: /tmp/cosign
    ALQUIMIA_OCI_COSIGN_TLOG_UPLOAD: "false"
    ALQUIMIA_REGISTRY_DIR: /var/lib/alquimia/registry
    ALQUIMIA_REGISTRY_SECRET_RESOLVER: vault
    ALQUIMIA_REGISTRY_REHYDRATE_ENABLED: "true"
    ALQUIMIA_REGISTRY_REHYDRATE_BUNDLED_BLOBS: "false"
    VAULT_MOUNT_POINT: secret
    VAULT_TLS: "false"
    DB_POOL_SIZE: "10"
    DB_POOL_OVERFLOW: "10"
    DB_POOL_PRE_PING: "true"
    DB_POOL_RECYCLE: "1800"
    DB_CREATE_ON_STARTUP: "false"
    TOOL_AUTHZ_ENABLED: "true"
    TOOL_AUTHZ_DEFAULT_DENY: "false"
    KNOWLEDGE_AUTHZ_ENABLED: "true"
    KNOWLEDGE_AUTHZ_DEFAULT_DENY: "false"
    KAFKA_MAX_REQUEST_SIZE: "10485760"
  # false: runtime con API_TOKEN, Kafka en claro y OCI en modo dev.
  # true: perfil de alquimia-runtime-develop (Keycloak, SPIFFE, firma OCI,
  # TLS_ENFORCE). El socket CSI lo monta el runtime; el server y el agent
  # los instala spire.enabled (o tienen que existir ya). El Kafka de este
  # chart no tiene TLS: kafkaSecurityProtocol queda PLAINTEXT salvo que
  # apuntes a un broker con auth.
  zeroTrust:
    enabled: false
    acceptedAudiences: alquimia-runtime
    roleSourceClients: alquimia-runtime,alquimia-studio-service,alquimia-ci
    # Dominio SPIFFE del cliente. Ejemplo: acme.example
    trustDomain: acme.example
    socketPath: /run/spire/sockets/agent.sock
    delegated: true
    agentspaceProvisioning: true
    provisioningIntervalSeconds: "300"
    provisioningNamespace: spire
    vaultJwtAuthPath: jwt
    signaturePolicy: required
    tlsEnforce: false
    # Solo aplican si registry.tls es false. Con tls el runtime confía la CA
    # local y estos flags quedan en false.
    orasPlainHttp: "false"
    orasInsecure: "false"
    kafkaSecurityProtocol: PLAINTEXT
  # PEM de la clave pública de cosign de la org. Vacío: no se monta y los
  # pulls con signaturePolicy=required siguen sin poder verificar.
  cosign:
    publicKey: ""
  secrets:
    kafkaSigningKey: ""
    apiToken: ""
    vaultToken: ""
    # Vacío: no se crea el Secret. Hay que generarlo una vez y respaldarlo
    # fuera del cluster; sin la clave no se lee lo que ya se cifró.
    encryptionKey: ""
    encryptionKeyId: ""
    registryKey: ""
    registryKeyId: ""
    # Tiene que coincidir con lo que firman los channel connectors.
    channelNotificationSecret: ""
    s3:
      accessKey: ""
      secretKey: ""
      bucketName: alquimia-runtime-blob-storage
      registryBucketName: alquimia-runtime-registry-storage
      provider: Minio
      region: us-east-1
      secure: "false"

# false: no instala SPIRE. true: server, agent, CSI, OIDC discovery,
# controller-manager y las ClusterStaticEntry de master/worker.
# Namespace aparte (privilegiado). El runtime sigue en el namespace del chart
# y usa el socket por CSI, así puede quedar en restricted.
# platform auto: en un helm install contra OpenShift copia la CA del kubelet;
# en Kubernetes/EKS no. Con Argo el lookup suele venir vacío: en OpenShift
# poner platform: openshift y crear el ConfigMap spire-agent-kubelet-ca
# (clave ca.crt) o pegar el PEM en kubeletCA.bundle.
# kubeletRoot: /var/lib/kubelet en OpenShift, EKS y Kubernetes. Cambiarlo si
# la AMI mueve el kubelet.
spire:
  enabled: false
  namespace: spire
  platform: auto
  clusterName: alquimia
  # Vacío: runtime.zeroTrust.trustDomain.
  trustDomain: ""
  storage: 1Gi
  storageClass: ""
  socketHostPath: /run/spire/sockets
  kubeletRoot: /var/lib/kubelet
  agentRunAsUser: 1000
  imagePullSecrets: []
  tolerations: []
  kubeletCA:
    bundle: ""

# Sin Keycloak Operator. Con enabled: true usa el PostgreSQL de este chart
# (base `database`) en el mismo namespace.
# Con enabled: false no instala nada: existing.url o existing.service apuntan
# a una instancia que ya existe. El chart deja esa URL en el ConfigMap keycloak-config.
keycloak:
  # false: no crea Deployment, Service, Route ni Ingress.
  enabled: true
  existing:
    # URL de la instancia externa. Tiene prioridad sobre service.
    url: ""
    # Service ya existente, normalmente en otro namespace.
    service: ""
    namespace: ""
    port: 8080
    # Secret ya existente con el admin. Solo se anota en keycloak-config.
    secretName: ""
  # Realm que emite los JWT de usuarios (OIDC).
  realm: alquimia
  # El runtime de alquimia-runtime-develop rechaza la audience genérica account.
  acceptedAudiences: alquimia-runtime
  # Opcional si runtime.zeroTrust.enabled es false. Con zeroTrust el runtime
  # usa Keycloak igual (AUTH_PROVIDER=keycloak).
  runtimeAuth:
    enabled: false
    clientId: alquimia-runtime
    clientSecret: ""
    # Secret del cliente admin que FastAPIKeycloak usa en client_credentials.
    adminClientSecret: ""
    callbackUri: ""
  # Studio puede quedar en AUTH_STRATEGY=lite. true lo pasa a Keycloak (NextAuth).
  studioAuth:
    enabled: false
    clientId: alquimia-studio
    clientSecret: ""
  replicas: 1
  database: keycloak
  # Vacío: keycloak.<appsDomain> (dominio apps del cluster).
  host: ""
  # route (OpenShift) o ingress (EKS u otro cluster con Ingress).
  exposure: route
  ingress:
    className: ""
    path: /
    pathType: Prefix
    annotations: {}
    # En EKS con AWS Load Balancer Controller, por ejemplo:
    # className: alb
    # annotations:
    #   alb.ingress.kubernetes.io/scheme: internet-facing
    #   alb.ingress.kubernetes.io/target-type: ip
    #   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    #   alb.ingress.kubernetes.io/ssl-redirect: "443"
    #   alb.ingress.kubernetes.io/group.name: acme
    #   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/ID
    tls:
      enabled: false
      secretName: ""
  auth:
    username: ""
    password: ""

# false: no crea ClusterPolicy. Kyverno tiene que estar instalado en el cluster;
# este chart no lo instala. true: aplica las políticas de
# alquimia-runtime-develop/k8s/policies/kyverno a cada Pod del namespace.
# Con Enforce, un Pod que no cumpla (registro, securityContext, límites de
# CPU/memoria o firma de alquimiaai/runtime) no se crea.
kyverno:
  enabled: false

studio:
  enabled: true
  replicas: 1
  storage: 5Gi
  # cluster: solo el Service (svc.cluster.local). ingress: Ingress. route: Route de OpenShift.
  exposure: route
  # Vacío en route: alquimia-studio.<appsDomain>. En ingress es obligatorio.
  host: ""
  ingress:
    className: ""
    path: /
    pathType: Prefix
    annotations: {}
  config:
    DB_STRATEGY: lite
    AUTH_STRATEGY: lite
    NEXT_PUBLIC_DEFAULT_NAMESPACE: alquimia
    # on y true en el perfil zero trust. off y false dejan Studio sin ZT.
    NEXT_PUBLIC_ZERO_TRUST: "off"
    NEXT_PUBLIC_TOOL_AUTHZ_ENABLED: "false"
    RUNTIME_USER_IDENTITY: passthrough
    RUNTIME_TOKEN_AUDIENCE: alquimia-runtime
    # Mismo host que registry.public.host. Ejemplo: registry.acme.example
    EXTERNAL_REGISTRY_URL: registry.acme.example
    EXTERNAL_REGISTRY_AGENTS_PROJECT: agents
    EXTERNAL_REGISTRY_BRAINS_PROJECT: brains
    # Se ignora si otel.enabled: el SDK queda activo para exportar al collector.
    OTEL_SDK_DISABLED: "true"
    NODE_ENV: production
  secrets:
    authLiteUsers: ""
    assistantApiKey: ""
    nextAuthSecret: ""
